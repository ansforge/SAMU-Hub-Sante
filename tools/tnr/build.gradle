plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/ansforge/SAMU-Hub-Sante")
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    // This dependency is used by the application.
    implementation libs.guava
    implementation "com.hubsante:models:${libs.versions.models.get()}"
    implementation "org.slf4j:slf4j-simple:${libs.versions.slf4jSimple.get()}"
    implementation "com.rabbitmq:amqp-client:${libs.versions.rabbitmqClient.get()}"
    implementation "io.github.cdimascio:dotenv-java:${libs.versions.dotenvJava.get()}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${libs.versions.jacksonDatabind.get()}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${libs.versions.jacksonDatatypeJsr310.get()}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${libs.versions.jacksonDataformatXml.get()}"
    implementation "javax.validation:validation-api:${libs.versions.validationApi.get()}"
    implementation "com.networknt:json-schema-validator:${libs.versions.jsonSchemaValidator.get()}"
    implementation "com.github.ben-manes.caffeine:caffeine:${libs.versions.caffeine.get()}"
    implementation "org.slf4j:slf4j-api:${libs.versions.slf4jApi.get()}"
    runtimeOnly "ch.qos.logback:logback-classic:${libs.versions.logback.get()}"
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter(libs.versions.junitJupiter.get())
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.register('runConsumer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.MyConsumer'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}