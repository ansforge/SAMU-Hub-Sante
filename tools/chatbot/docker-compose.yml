# VULNERABLE docker-compose configuration
version: '3.8'

services:
  chatbot:
    build: .
    container_name: vulnerable-chatbot
    # VULNERABILITY: Running as privileged container
    privileged: true
    # VULNERABILITY: Exposing host network
    network_mode: host
    # VULNERABILITY: Mounting sensitive host directories
    volumes:
      - /:/host-root
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/passwd:/etc/passwd
      - /etc/shadow:/etc/shadow
    # VULNERABILITY: Hardcoded secrets in environment
    environment:
      - SECRET_KEY=hardcoded-secret-key-123
      - DATABASE_PASSWORD=admin123
      - API_TOKEN=sk-1234567890abcdef
      - DEBUG=true
      - DISABLE_SSL_VERIFICATION=true
    # VULNERABILITY: Exposing unnecessary ports
    ports:
      - "22:22"    # SSH
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
      - "3306:3306" # MySQL
    # VULNERABILITY: Adding unnecessary capabilities
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - ALL
    # VULNERABILITY: Disabling security features
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    # VULNERABILITY: Running as root user
    user: "0:0"

  database:
    image: mysql:5.7  # VULNERABILITY: Using older image with CVEs
    container_name: vulnerable-mysql
    # VULNERABILITY: Weak database credentials
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=chatbot
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    # VULNERABILITY: Exposing database port
    ports:
      - "3306:3306"
    # VULNERABILITY: No resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  redis:
    image: redis:6.0  # VULNERABILITY: Using older Redis version
    container_name: vulnerable-redis
    # VULNERABILITY: Redis without authentication
    command: redis-server --requirepass ""
    # VULNERABILITY: Exposing Redis port
    ports:
      - "6379:6379"