[project]
name = "healthcheck"
version = "0.1.0"
description = "Healthcheck service to expose status of Hub Santé internal components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coverage==7.15.2",
    "flask==3.1.3",
    "gunicorn==23.0.0",
    "parameterized==0.9.0",
    "prometheus-client==0.25.0",
    "prometheus-flask-exporter==0.23.2",
    "requests==2.34.2",
    "werkzeug==3.1.8",
    "pymongo==4.17.0"
]

[tool.coverage.run]
branch = true
omit = [
    "tests/*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "pass",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]
