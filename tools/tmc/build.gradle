plugins {
    id 'java'
    // The following line allows to load io.gatling.gradle plugin and directly apply it
    alias(libs.plugins.gatling)
    alias(libs.plugins.jib)
}

ext {
    modelVersion = project.hasProperty('modelVersion') ? project.getProperty('modelVersion') : libs.versions.models.get()
    // Gradle 9 removed the legacy Convention API; the gatling-gradle-plugin (tested up to Gradle 8.6)
    // still reads this property eagerly off the project, so we provide it ourselves.
    reportsDir = layout.buildDirectory.dir('reports').get().asFile
}

dependencies {
    gatling("org.galaxio:gatling-amqp-plugin_2.13:${libs.versions.gatlingAmqpPlugin.get()}")
    gatling("io.github.cdimascio:dotenv-java:${libs.versions.dotenvJava.get()}")
    gatling("com.hubsante:models:${project.ext.modelVersion}")
}

gatling {
    enterprise {
        // Enterprise Cloud (https://cloud.gatling.io/) configuration reference: https://gatling.io/docs/gatling/reference/current/extensions/gradle_plugin/#working-with-gatling-enterprise-cloud
        // Enterprise Self-Hosted configuration reference: https://gatling.io/docs/gatling/reference/current/extensions/gradle_plugin/#working-with-gatling-enterprise-self-hosted
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/ansforge/SAMU-Hub-Modeles")
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
    }
}

configurations.all {
    resolutionStrategy {
        // Force newer versions to fix security vulnerabilities
        force "commons-io:commons-io:${libs.versions.commonsIo.get()}"
        force "org.apache.sshd:sshd-common:${libs.versions.sshd.get()}"
        force "org.apache.sshd:sshd-core:${libs.versions.sshd.get()}"
        force "org.apache.sshd:sshd-sftp:${libs.versions.sshd.get()}"
    }
}

def simulationListDir = layout.buildDirectory.dir('generated/tmc-resources')

// Lists the simulations run by loadtesting.launcher.TmcLauncher, so it needs no classpath scanning at runtime
def generateSimulationList = tasks.register('generateSimulationList') {
    def javaSources = fileTree('src/gatling/java') { include '**/simulations/*Simulation.java' }
    def sourceRoot = file('src/gatling/java')
    inputs.files(javaSources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(simulationListDir)

    doLast {
        def simulations = javaSources.files.collect { f ->
            sourceRoot.toPath().relativize(f.toPath()).toString()
                    .replace(File.separatorChar, '.' as char)
                    .replaceAll(/\.java$/, '')
        }.sort()
        def output = simulationListDir.get().file('tmc-simulations.txt').asFile
        output.parentFile.mkdirs()
        output.text = simulations.join('\n') + '\n'
    }
}

sourceSets.gatling.resources.srcDir(generateSimulationList)

tasks.register('runGatlingSimulations', JavaExec) {
    group = 'gatling'
    description = 'Run all Gatling simulations, or the subset given by -Psimulations=A,B, in parallel (one JVM per simulation).'

    classpath = sourceSets.gatling.runtimeClasspath
    mainClass = 'loadtesting.launcher.TmcLauncher'
    workingDir = projectDir
    environment 'TMC_RESULTS_DIR', layout.buildDirectory.dir('reports/gatling').get().asFile.absolutePath
    if (project.hasProperty('simulations')) {
        environment 'TMC_SIMULATIONS', project.property('simulations')
    }
}

// Jib only containerizes the main source set: the gatling one is packaged as a jar and added to the image
// through a dedicated classpath configuration
def tmcSimulationsJar = tasks.register('tmcSimulationsJar', Jar) {
    archiveClassifier = 'simulations'
    from sourceSets.gatling.output
}

configurations {
    tmcImageClasspath {
        canBeConsumed = false
        canBeResolved = true
        // Only the external dependencies: the other gatling configurations also hold the source sets' output directories
        extendsFrom configurations.gatling
        attributes { container ->
            def source = configurations.gatlingRuntimeClasspath.attributes
            source.keySet().each { key -> container.attribute(key, source.getAttribute(key)) }
        }
    }
}

dependencies {
    tmcImageClasspath files(tmcSimulationsJar)
}

jib {
    configurationName = 'tmcImageClasspath'
    from {
        image = 'eclipse-temurin:21-jre-alpine'
    }
    to {
        image = project.findProperty('image') ?: 'ghcr.io/ansforge/tmc:latest'
        tags = [project.findProperty('version') ?: 'latest']
    }
    container {
        mainClass = 'loadtesting.launcher.TmcLauncher'
        jvmFlags = ['-Xmx128m']
        workingDirectory = '/app'
        user = '1000:1000'
    }
}
