# Build matrices configuration for all projects
# Release format: {project-name}-{version}
# Example: lrm-1.2.3, chatbot-2.1.0-beta

projects:
  lrm:
    description: "LRM project - includes both backend and frontend components"
    include:
      - name: lrm-backend
        context: ./web/lrm/server
        tag: hub-lrm-back
        artifact-name: trivy-reports-lrm-backend
      - name: lrm-frontend
        context: ./web/lrm/client
        tag: hub-lrm-front
        artifact-name: trivy-reports-lrm-frontend

  landing:
    description: "Landing page web component"
    include:
      - name: landing
        context: ./web/landing
        tag: hub-web-landing
        artifact-name: trivy-reports-landing

  healthcheck:
    description: "Health monitoring tool"
    include:
      - name: healthcheck
        context: ./tools/healthcheck
        tag: hub-healthcheck
        artifact-name: trivy-reports-healthcheck

  chatbot:
    description: "AI chatbot service"
    include:
      - name: chatbot
        context: ./tools/chatbot
        tag: hub-chatbot
        artifact-name: trivy-reports-chatbot

  openssl:
    description: "OpenSSL utilities"
    include:
      - name: openssl
        context: ./tools/openssl
        tag: openssl
        artifact-name: trivy-reports-openssl

  specs:
    description: "API specifications documentation"
    include:
      - name: specs
        context: ./web/specs
        tag: hub-specs
        artifact-name: trivy-reports-specs

  annuaire:
    description: "Directory service"
    include:
      - name: annuaire
        context: ./tools/annuaire
        tag: hub-annuaire
        artifact-name: trivy-reports-annuaire

  dispatcher:
    description: "Hub dispatcher service"
    # Note: dispatcher doesn't use the build-image job, handled separately