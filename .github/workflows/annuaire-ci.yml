name: Annuaire CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/annuaire/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/annuaire/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Run tests & generate HTML coverage report
        run: |
          uv run coverage run --source=annuaire -m unittest test_annuaire.py
          uv run coverage report -m
          uv run coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          # Working directory is not used in the action
          # https://github.com/actions/upload-artifact/issues/232
          path: tools/annuaire/htmlcov
          retention-days: 7

  security-scan:
    uses: ./.github/workflows/security-scan.yml
    with:
      working-directory: 'tools/annuaire'
      project-type: 'python'
      python-version: '3.13'
      component-name: 'annuaire'
      scan-dockerfile: true
      dependency-scan: true
