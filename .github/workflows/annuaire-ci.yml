name: Annuaire CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/annuaire/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/annuaire/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Run tests & generate HTML coverage report
        run: |
          uv run coverage run --source=annuaire -m unittest test_annuaire.py
          uv run coverage report -m
          uv run coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Working directory is not used in the action
          # https://github.com/actions/upload-artifact/issues/232
          path: tools/annuaire/htmlcov
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v5

      # 2️⃣ Install uv (Python 3.13 included)
      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.13"

      # 3️⃣ Install security tools via uv
      - name: Install security tools
        run: |
          uv add --dev uv-secure semgrep

      # 4️⃣ Dependency scan
      - name: Scan dependencies (uv-secure)
        run: |
          uv run uv-secure uv.lock --format json > uv-secure.json || true

      # 5️⃣ Semgrep scan (code scanning)
      - name: Run Semgrep
        run: |
          # Exclude virtual environments, cache, and non-source directories
          uv run semgrep --config auto --sarif --output semgrep.sarif \
            --exclude='.venv' \
            --exclude='.cache' \
            --exclude='__pycache__' \
            --exclude='.git' \
            --exclude='.pytest_cache' \
            --exclude='node_modules' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='.tox' \
            --exclude='.mypy_cache' \
            --exclude='uv.lock' \
            --exclude='*.pyc'

      - name: Fix Semgrep SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/annuaire/semgrep.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/annuaire/semgrep.sarif'
          scan-path: 'tools/annuaire'

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/annuaire/semgrep.sarif
          category: semgrep-annuaire

      # 6️⃣ Trivy scan (filesystem, Dockerfile, configs, secrets)
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: tools/annuaire
          scanners: vuln,secret,config
          format: sarif
          output: tools/annuaire/trivy-filesystem.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: tools/annuaire/Dockerfile
          scanners: vuln,config
          format: sarif
          output: tools/annuaire/trivy-dockerfile.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Fix Trivy filesystem SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/annuaire/trivy-filesystem.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/annuaire/trivy-filesystem.sarif'
          scan-path: 'tools/annuaire'

      - name: Upload Trivy filesystem results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/annuaire/trivy-filesystem.sarif
          category: trivy-annuaire-filesystem

      - name: Fix Trivy Dockerfile SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/annuaire/trivy-dockerfile.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/annuaire/trivy-dockerfile.sarif'
          scan-path: 'tools/annuaire'

      - name: Upload Trivy Dockerfile results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/annuaire/trivy-dockerfile.sarif
          category: trivy-annuaire-dockerfile

      # 7️⃣ Upload all security scan reports as a single artifact
      - name: Upload Security scan reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-annuaire
          path: |
            tools/annuaire/semgrep.sarif
            tools/annuaire/trivy-filesystem.sarif
            tools/annuaire/trivy-dockerfile.sarif
            tools/annuaire/uv-secure.json
          retention-days: 7
          if-no-files-found: warn
