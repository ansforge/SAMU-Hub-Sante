name: Annuaire CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/annuaire/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/annuaire/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Run tests & generate HTML coverage report
        run: |
          uv run coverage run --source=annuaire -m unittest test_annuaire.py
          uv run coverage report -m
          uv run coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Working directory is not used in the action
          # https://github.com/actions/upload-artifact/issues/232
          path: tools/annuaire/htmlcov
          retention-days: 7

      - name: Run Trivy vulnerability scanner - Dependencies
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: 'tools/annuaire'
          format: 'sarif'
          output: 'trivy-dependencies.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
        continue-on-error: false

      - name: Fix SARIF file paths for GitHub Security tab
        if: always() && hashFiles('trivy-dependencies.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'trivy-dependencies.sarif'
          scan-path: 'tools/annuaire'

      - name: Upload Trivy scan results to GitHub Security tab - Dependencies
        if: always() && hashFiles('trivy-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-dependencies.sarif'
          category: 'trivy-annuaire-dependencies'

      - name: Run Trivy vulnerability scanner - Dockerfile
        id: trivy-dockerfile
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: 'tools/annuaire/Dockerfile'
          format: 'sarif'
          output: 'trivy-dockerfile.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'config,secret,vuln,license'
        continue-on-error: true

      - name: Fix Dockerfile SARIF file paths for GitHub Security tab
        if: always() && hashFiles('trivy-dockerfile.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'trivy-dockerfile.sarif'
          scan-path: 'tools/annuaire'

      - name: Upload Trivy scan results to GitHub Security tab - Dockerfile
        if: always() && hashFiles('trivy-dockerfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-dockerfile.sarif'
          category: 'trivy-annuaire-dockerfile'

      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-annuaire
          path: '*.sarif'
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run security audit
        run: uv run pip-audit
        continue-on-error: true
