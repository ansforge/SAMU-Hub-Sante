name: Annuaire CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/annuaire/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/annuaire/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/annuaire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests & generate HTML coverage report
        run: |
          coverage run --source=annuaire -m unittest test_annuaire.py
          coverage report -m
          coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Working directory is not used in the action
          # https://github.com/actions/upload-artifact/issues/232
          path: tools/annuaire/htmlcov
          retention-days: 7
