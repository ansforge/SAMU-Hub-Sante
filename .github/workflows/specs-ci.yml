name: Specs CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/specs/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/specs/**"

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/specs/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tools/specs/client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/specs/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Check typing
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest -q

  security-scan-client:
    uses: ./.github/workflows/security-scan.yml
    with:
      working-directory: 'tools/specs/client'
      project-type: 'nodejs'
      node-version: '24.11'
      component-name: 'specs-client'
      scan-dockerfile: true

  security-scan-server:
    uses: ./.github/workflows/security-scan.yml
    with:
      working-directory: 'tools/specs/server'
      project-type: 'python'
      python-version: '3.14'
      component-name: 'specs-server'
      scan-dockerfile: true
      dependency-scan: true
