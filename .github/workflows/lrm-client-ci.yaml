name: LRM Client CI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'web/lrm/client/**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'web/lrm/client/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/lrm/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run Prettier check
        run: npx prettier --check "**/*.{js,ts,vue,css,scss}"

  cypress-run:
    runs-on: ubuntu-24.04

    env:
      NUXT_PUBLIC_VHOST_MAP: >
        {
          "15-15_v1.5": "1.0",
          "15-nexsis_v1.8": "1.0",
          "15-smur_v1.4": "1.0",
          "15-gps_v1.0": "1.0"
        }
      NUXT_PUBLIC_CLIENT_MAP: >
        [
          ["fr.health.samuA", ["fr.health.samuC"]],
          ["fr.health.samuC", ["fr.health.samuA"]]
        ]
      NUXT_PUBLIC_MODEL_BRANCH: develop
      NUXT_PUBLIC_BACKEND_LRM_SERVER: integration.hub.esante.gouv.fr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print environment variables
        run: printenv

      - name: Prune npm modules
        working-directory: ./web/lrm/client
        run: npm prune

      - name: Install dependencies
        working-directory: ./web/lrm/client
        run: npm ci

      - name: Build app
        working-directory: ./web/lrm/client
        run: npm run build:test

      - name: Start app in background
        working-directory: ./web/lrm/client
        run: |
          npm run start &
          npx wait-on http://localhost:3000/lrm/ --timeout 30000

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./web/lrm/client
          install: false
          browser: chrome

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: web/lrm/client/cypress/screenshots
          if-no-files-found: ignore