name: Build TMC image
on:
  push:
    tags:
      - 'tmc-*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image TMC"
        required: true
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      tmc-version: ${{ steps.extract-tmc-version.outputs.version }}
    steps:
      - name: Extract version from tag or input
        id: extract-tmc-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
            VERSION=${TAG_NAME#tmc-}
          fi
          PATTERN="^([0-9]+\.[0-9]+(\.[0-9]+)?)(-[A-Za-z0-9\.]+)*$"
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Invalid version number: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-tmc:
    name: Build TMC image
    needs: get-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tmc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image with Jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMC_VERSION: ${{ needs.get-version.outputs.tmc-version }}
        run: |
          echo "Building TMC image for version $TMC_VERSION using Jib"
          ./gradlew jib \
            -Pversion=$TMC_VERSION \
            -Pimage=ghcr.io/${{ github.repository_owner }}/tmc:$TMC_VERSION

