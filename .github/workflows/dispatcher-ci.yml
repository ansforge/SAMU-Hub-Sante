name: Dispatcher CI

on:
  push:
    branches:
      - main
    paths:
      - 'hub/dispatcher/**'

  pull_request:
    branches:
      - '**'
    paths:
      - 'hub/dispatcher/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/dispatcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Check license
        env:
          # required to run tests because the whole build.gradle seems to be evaluated, even if the jib task is not executed
          # so the GITHUB_TOKEN var must be resolved
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew licenseFormat


      - name: Build and run tests
        env:
          # required to run tests because the whole build.gradle seems to be evaluated, even if the jib task is not executed
          # so the GITHUB_TOKEN var must be resolved
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCHER_TESTS_MODEL_VERSIONS: ${{ vars.DISPATCHER_TESTS_MODEL_VERSIONS }}
        run: |
          # test on each supported model lib version
          for MODEL_VERSION in $DISPATCHER_TESTS_MODEL_VERSIONS; do
            echo "🚀 Running dispatcher tests for model version $MODEL_VERSION"
            ./gradlew test -PmodelVersion=$MODEL_VERSION
          done

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.3
        with:
          paths: ${{ github.workspace }}/hub/dispatcher/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60

      - name: Setup .NET Core # Required to execute ReportGenerator
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.x
          dotnet-quality: 'ga'

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.1.23
        with:
          reports: ${{ github.workspace }}/hub/dispatcher/build/reports/jacoco/test/jacocoTestReport.xml
          targetdir: coveragereport

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner - Filesystem Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: 'hub/dispatcher'
          format: 'sarif'
          output: 'trivy-filesystem.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          scanners: 'vuln,secret,config,license'
          skip-files: '**/build/**,**/gradle/wrapper/**,**/.gradle/**'
        continue-on-error: true

      - name: Fix SARIF file paths for GitHub Security tab - Filesystem
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'trivy-filesystem.sarif'
          scan-path: 'hub/dispatcher'

      - name: Upload Trivy scan results to GitHub Security tab - Filesystem
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-filesystem.sarif'
          category: 'trivy-dispatcher-filesystem'

      - name: Run Trivy vulnerability scanner - Dockerfile
        id: trivy-dockerfile
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: 'hub/dispatcher/Dockerfile'
          format: 'sarif'
          output: 'trivy-dockerfile.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'config,secret,vuln,license'
        continue-on-error: true

      - name: Fix Dockerfile SARIF file paths for GitHub Security tab
        if: always() && hashFiles('trivy-dockerfile.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'trivy-dockerfile.sarif'
          scan-path: 'hub/dispatcher'

      - name: Upload Trivy scan results to GitHub Security tab - Dockerfile
        if: always() && hashFiles('trivy-dockerfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-dockerfile.sarif'
          category: 'trivy-dispatcher-dockerfile'

      - name: Upload Security scan reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-dispatcher
          path: |
            trivy-filesystem.sarif
            trivy-dockerfile.sarif
          retention-days: 7
          if-no-files-found: warn