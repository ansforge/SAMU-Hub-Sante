name: Dispatcher CI

on:
  push:
    branches:
      - main
    paths:
      - 'hub/dispatcher/**'

  pull_request:
    branches:
      - '**'
    paths:
      - 'hub/dispatcher/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/dispatcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Check license
        env:
          # required to run tests because the whole build.gradle seems to be evaluated, even if the jib task is not executed
          # so the GITHUB_TOKEN var must be resolved
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew licenseFormat


      - name: Build and run tests
        env:
          # required to run tests because the whole build.gradle seems to be evaluated, even if the jib task is not executed
          # so the GITHUB_TOKEN var must be resolved
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCHER_TESTS_MODEL_VERSIONS: ${{ vars.DISPATCHER_TESTS_MODEL_VERSIONS }}
        run: |
          # test on each supported model lib version
          for MODEL_VERSION in $DISPATCHER_TESTS_MODEL_VERSIONS; do
            echo "🚀 Running dispatcher tests for model version $MODEL_VERSION"
            ./gradlew test -PmodelVersion=$MODEL_VERSION
          done

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.3
        with:
          paths: ${{ github.workspace }}/hub/dispatcher/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60

      - name: Setup .NET Core # Required to execute ReportGenerator
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.x
          dotnet-quality: 'ga'

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.1.23
        with:
          reports: ${{ github.workspace }}/hub/dispatcher/build/reports/jacoco/test/jacocoTestReport.xml
          targetdir: coveragereport

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    defaults:
      run:
        working-directory: hub/dispatcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK # needed for Gradle project analysis
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Semgrep (code scanning)
        run: |
          # Install Semgrep
          pip install semgrep
          # Exclude virtual environments, cache, and non-source directories
          semgrep --config auto --sarif --output semgrep.sarif \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='gradle/wrapper' \
            --exclude='.git' \
            --exclude='*.class' \
            --exclude='*.jar'

      - name: Fix Semgrep SARIF file paths for GitHub Security tab
        if: always() && hashFiles('hub/dispatcher/semgrep.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'hub/dispatcher/semgrep.sarif'
          scan-path: 'hub/dispatcher'

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hub/dispatcher/semgrep.sarif
          category: semgrep-dispatcher

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: hub/dispatcher
          scanners: vuln,secret,config
          format: sarif
          output: hub/dispatcher/trivy-filesystem.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Fix Trivy filesystem SARIF file paths for GitHub Security tab
        if: always() && hashFiles('hub/dispatcher/trivy-filesystem.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'hub/dispatcher/trivy-filesystem.sarif'
          scan-path: 'hub/dispatcher'

      - name: Upload Trivy filesystem results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hub/dispatcher/trivy-filesystem.sarif
          category: trivy-dispatcher-filesystem

      - name: Upload Security scan reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-dispatcher
          path: |
            hub/dispatcher/semgrep.sarif
            hub/dispatcher/trivy-filesystem.sarif
          retention-days: 7
          if-no-files-found: warn