          sarif_file: 'trivy-chatbot-image.sarif'
          category: 'trivy-chatbot-image'

      - name: Upload Chatbot image scan reports as artifacts
        if: always() && steps.extract_info.outputs.project == 'chatbot'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-chatbot-image
          path: '*.sarif'
          retention-days: 7

      - name: Build and push openssl Docker image
        if: steps.extract_info.outputs.project == 'openssl'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/openssl:${{ steps.extract_info.outputs.version }}
          context: ./tools/openssl

      - name: Scan openssl Docker image
        if: steps.extract_info.outputs.project == 'openssl'
        continue-on-error: true
