        with:
          sarif_file: 'trivy-healthcheck-image.sarif'
          category: 'trivy-healthcheck-image'

      - name: Upload Healthcheck image scan reports as artifacts  
        if: always() && steps.extract_info.outputs.project == 'healthcheck'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-healthcheck-image
          path: '*.sarif'
          retention-days: 7

      - name: Build and push chatbot Docker image
        if: steps.extract_info.outputs.project == 'chatbot'
