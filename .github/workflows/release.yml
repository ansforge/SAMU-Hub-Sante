name: build image on release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Grant execute permission for Gradlew
        run: chmod +x hub/dispatcher/gradlew
      - name: Extract release information
        id: extract_info
        run: |
          RELEASE_NAME=${{ github.event.release.name || github.ref_name }}
          echo $RELEASE_NAME
          
          if [[ "$RELEASE_NAME" == dispatcher-* ]]; then
            PROJECT="dispatcher"
            VERSION=${RELEASE_NAME#dispatcher-}
          elif [[ "$RELEASE_NAME" == lrm-* ]]; then
            PROJECT="lrm"
            VERSION=${RELEASE_NAME#lrm-}
          elif [[ "$RELEASE_NAME" == landing-* ]]; then
            PROJECT="landing"
            VERSION=${RELEASE_NAME#landing-}
          elif [[ "$RELEASE_NAME" == healthcheck-* ]]; then
            PROJECT="healthcheck"
            VERSION=${RELEASE_NAME#healthcheck-}
          elif [[ "$RELEASE_NAME" == chatbot-* ]]; then
            PROJECT="chatbot"
            VERSION=${RELEASE_NAME#chatbot-}
          elif [[ "$RELEASE_NAME" == specs-* ]]; then
            PROJECT="specs"
            VERSION=${RELEASE_NAME#specs-}
          elif [[ "$RELEASE_NAME" == openssl-* ]]; then
            PROJECT="openssl"
            VERSION=${RELEASE_NAME#openssl-}
          elif [[ "$RELEASE_NAME" == annuaire-* ]]; then
            PROJECT="annuaire"
            VERSION=${RELEASE_NAME#annuaire-}
          elif [[ "$RELEASE_NAME" == dex-* ]]; then
            PROJECT="dex-config-generator"
            VERSION=${RELEASE_NAME#dex-}
          else
            echo "Invalid release name prefix. Must be 'dispatcher', 'lrm', 'landing', 'healthcheck', 'chatbot', 'specs', 'annuaire', 'openssl' or 'dex'."
            exit 1
          fi
          
          PATTERN="^([0-9]+\.[0-9]+(\.[0-9]+)?)(-[A-Za-z0-9\.]+)*$"
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Invalid version number"
            exit 1
          fi
          
          echo "::set-output name=project::$PROJECT"
          echo "::set-output name=version::$VERSION"
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests, build and push dispatcher Docker image
        if: steps.extract_info.outputs.project == 'dispatcher'
        working-directory: hub/dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_info.outputs.version }}
        run: |
          # Build for each model version
          for MODEL_VERSION in "1.2" "2.3" "3.1"; do
            IMAGE_TAG="${TAG}-model-${MODEL_VERSION}"
            echo "Building image for $IMAGE_TAG"
            ./gradlew jib \
              -Pversion=$TAG \
              -PmodelVersion=$MODEL_VERSION \
              --image ghcr.io/${{ github.repository_owner }}/dispatcher:$IMAGE_TAG
          done
      - name: Build and push lrm backend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-lrm-back:${{ steps.extract_info.outputs.version }}
          context: ./web/lrm/server
      - name: Build and push lrm frontend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-lrm-front:${{ steps.extract_info.outputs.version }}
          context: ./web/lrm/client
      - name: Build and push landing Docker image
        if: steps.extract_info.outputs.project == 'landing'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-web-landing:${{ steps.extract_info.outputs.version }}
          context: ./web/landing
      - name: Build and push healthcheck service Docker image
        if: steps.extract_info.outputs.project == 'healthcheck'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-healthcheck:${{ steps.extract_info.outputs.version }}
          context: ./tools/healthcheck
      - name: Build and push chatbot Docker image
        if: steps.extract_info.outputs.project == 'chatbot'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-chatbot:${{ steps.extract_info.outputs.version }}
          context: ./tools/chatbot

      - name: Build and push openssl Docker image
        if: steps.extract_info.outputs.project == 'openssl'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/openssl:${{ steps.extract_info.outputs.version }}
          context: ./tools/openssl

      - name: Build and push specs Docker image
        if: steps.extract_info.outputs.project == 'specs'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-specs:${{ steps.extract_info.outputs.version }}
          context: ./web/specs

      - name: Build and push annuaire Docker image
        if: steps.extract_info.outputs.project == 'annuaire'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-annuaire:${{ steps.extract_info.outputs.version }}
          context: ./tools/annuaire

      - name: Build and push dex-config-generator Docker image
        if: steps.extract_info.outputs.project == 'dex-config-generator'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-dex-config-generator:${{ steps.extract_info.outputs.version }}
          context: ./tools/dex-config-generator
