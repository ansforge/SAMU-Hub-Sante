name: build image on release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Extract release information
        id: extract_info
        run: |
          RELEASE_NAME=${{ github.event.release.name || github.ref_name }}
          echo $RELEASE_NAME
          
          if [[ "$RELEASE_NAME" == dispatcher-* ]]; then
            PROJECT="dispatcher"
            VERSION=${RELEASE_NAME#dispatcher-}
          elif [[ "$RELEASE_NAME" == lrm-* ]]; then
            PROJECT="lrm"
            VERSION=${RELEASE_NAME#lrm-}
          elif [[ "$RELEASE_NAME" == landing-* ]]; then
            PROJECT="landing"
            VERSION=${RELEASE_NAME#landing-}
          elif [[ "$RELEASE_NAME" == healthcheck-* ]]; then
            PROJECT="healthcheck"
            VERSION=${RELEASE_NAME#healthcheck-}
          elif [[ "$RELEASE_NAME" == chatbot-* ]]; then
            PROJECT="chatbot"
            VERSION=${RELEASE_NAME#chatbot-}
          elif [[ "$RELEASE_NAME" == specs-* ]]; then
            PROJECT="specs"
            VERSION=${RELEASE_NAME#specs-}
          elif [[ "$RELEASE_NAME" == openssl-* ]]; then
            PROJECT="openssl"
            VERSION=${RELEASE_NAME#openssl-}
          elif [[ "$RELEASE_NAME" == annuaire-* ]]; then
            PROJECT="annuaire"
            VERSION=${RELEASE_NAME#annuaire-}
          else
            echo "Invalid release name prefix. Must be 'dispatcher', 'lrm', 'landing', 'healthcheck', 'chatbot', 'specs' or 'annuaire'."
            exit 1
          fi
          
          PATTERN="^([0-9]+\.[0-9]+(\.[0-9]+)?)(-[A-Za-z0-9\.]+)*$"
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Invalid version number"
            exit 1
          fi
          
          echo "::set-output name=project::$PROJECT"
          echo "::set-output name=version::$VERSION"
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push lrm backend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-lrm-back:${{ steps.extract_info.outputs.version }}
          context: ./web/lrm/server

      - name: Scan LRM backend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/hub-lrm-back:${{ steps.extract_info.outputs.version }}'
          format: 'sarif'
          output: 'trivy-lrm-backend-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Build and push lrm frontend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-lrm-front:${{ steps.extract_info.outputs.version }}
          context: ./web/lrm/client

      - name: Scan LRM frontend Docker image
        if: steps.extract_info.outputs.project == 'lrm'
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/hub-lrm-front:${{ steps.extract_info.outputs.version }}'
          format: 'sarif'
          output: 'trivy-lrm-frontend-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload LRM Backend image scan results to GitHub Security tab
        if: always() && steps.extract_info.outputs.project == 'lrm' && hashFiles('trivy-lrm-backend-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-lrm-backend-image.sarif'
          category: 'trivy-lrm-backend-image'

      - name: Upload LRM Frontend image scan results to GitHub Security tab
        if: always() && steps.extract_info.outputs.project == 'lrm' && hashFiles('trivy-lrm-frontend-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-lrm-frontend-image.sarif'
          category: 'trivy-lrm-frontend-image'

      - name: Upload LRM image scan reports as artifacts
        if: always() && steps.extract_info.outputs.project == 'lrm'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-lrm-images
          path: '*.sarif'
          retention-days: 7

      - name: Build and push landing Docker image
        if: steps.extract_info.outputs.project == 'landing'
