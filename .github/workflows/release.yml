name: build image on release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  extract-release-info:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.extract_info.outputs.project }}
      version: ${{ steps.extract_info.outputs.version }}
      matrix: ${{ steps.extract_info.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Extract release information
        id: extract_info
        run: |
          RELEASE_NAME=${{ github.event.release.name || github.ref_name }}
          echo "Processing release: $RELEASE_NAME"
          
          # Simple pattern matching to extract project and version
          if [[ "$RELEASE_NAME" =~ ^([a-zA-Z-]+)-(.+)$ ]]; then
            PROJECT="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
            echo "Extracted project: $PROJECT, version: $VERSION"
          else
            echo "::error::Invalid release name format. Expected: 'project-version'"
            echo "::error::Received: '$RELEASE_NAME'"
            exit 1
          fi
          
          CONFIG_FILE=".github/config/build-matrices.yaml"
          
          # Check if project exists in YAML
          if ! yq eval ".projects | has(\"$PROJECT\")" "$CONFIG_FILE" | grep -q "true"; then
            echo "::error::Project '$PROJECT' is not configured!"
            echo "::notice::Available projects:"
            yq eval '.projects | keys | .[]' "$CONFIG_FILE" | sed 's/^/  - /'
            exit 1
          fi
          
          # Validate version format (semantic versioning)
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+(\.[0-9]+)?)(-[A-Za-z0-9\.]+)*$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            echo "::notice::Expected semantic versioning format (e.g., 1.2.3, 1.2.3-beta)"
            exit 1
          fi
          
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          INCLUDE_ARRAY=$(yq eval ".projects.${PROJECT}.include" "$CONFIG_FILE" -o=json -I=0)
          
          if [[ "$INCLUDE_ARRAY" == "null" ]]; then
            echo "::error::No include configuration found for project '$PROJECT'!"
            exit 1
          fi
          
          # Wrap in the matrix format expected by GitHub Actions
          MATRIX_JSON="{\"include\":$INCLUDE_ARRAY}"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-image:
    needs: extract-release-info
    if: needs.extract-release-info.outputs.project != 'dispatcher'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.extract-release-info.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:${{ needs.extract-release-info.outputs.version }}
          context: ${{ matrix.context }}

      - name: Scan Docker image
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:${{ needs.extract-release-info.outputs.version }}
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload image scan results to GitHub Security tab
        if: always() && hashFiles('trivy-${{ matrix.name }}-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}-image.sarif'
          category: 'trivy-${{ matrix.name }}-image'

      - name: Upload image scan reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: '*.sarif'
          retention-days: 30
