name: Chatbot CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/chatbot/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/chatbot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run linting
        run: |
          uv run black --check .
          uv run flake8 .

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run security audit
        run: uv run pip-audit
        continue-on-error: true