name: Chatbot CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/chatbot/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "tools/chatbot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install security tools
        run: |
          uv add --dev uv-secure semgrep

      - name: Scan dependencies (uv-secure)
        run: |
          uv run uv-secure uv.lock --format json > uv-secure.json || true

      - name: Run Semgrep (code scanning)
        run: |
          # Exclude virtual environments, cache, and non-source directories
          uv run semgrep --config auto --sarif --output semgrep.sarif \
            --exclude='.venv' \
            --exclude='.cache' \
            --exclude='__pycache__' \
            --exclude='.git' \
            --exclude='.pytest_cache' \
            --exclude='node_modules' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='.tox' \
            --exclude='.mypy_cache' \
            --exclude='uv.lock' \
            --exclude='*.pyc'

      - name: Fix Semgrep SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/chatbot/semgrep.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/chatbot/semgrep.sarif'
          scan-path: 'tools/chatbot'

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/chatbot/semgrep.sarif
          category: semgrep

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: tools/chatbot
          scanners: vuln,secret,config
          format: sarif
          output: tools/chatbot/trivy-filesystem.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: tools/chatbot/Dockerfile
          scanners: vuln,config
          format: sarif
          output: tools/chatbot/trivy-dockerfile.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Fix Trivy filesystem SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/chatbot/trivy-filesystem.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/chatbot/trivy-filesystem.sarif'
          scan-path: 'tools/chatbot'

      - name: Upload Trivy filesystem results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/chatbot/trivy-filesystem.sarif
          category: trivy-filesystem

      - name: Fix Trivy Dockerfile SARIF file paths for GitHub Security tab
        if: always() && hashFiles('tools/chatbot/trivy-dockerfile.sarif') != ''
        uses: ./.github/actions/fix-trivy-sarif
        with:
          sarif-file: 'tools/chatbot/trivy-dockerfile.sarif'
          scan-path: 'tools/chatbot'

      - name: Upload Trivy Dockerfile results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/chatbot/trivy-dockerfile.sarif
          category: trivy-dockerfile

      - name: Upload Security scan reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            tools/chatbot/semgrep.sarif
            tools/chatbot/trivy-filesystem.sarif
            tools/chatbot/trivy-dockerfile.sarif
            tools/chatbot/uv-secure.json
          retention-days: 7
          if-no-files-found: warn
