name: Build dispatcher image
on:
  workflow_dispatch:
  push:
    tags:
      - 'dispatcher-*'
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Extract release information
        id: extract_version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#dispatcher-}
          PATTERN="^([0-9]+\.[0-9]+(\.[0-9]+)?)(-[A-Za-z0-9\.]+)*$"
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Invalid version number"
            exit 1
          fi
          echo "::set-output name=version::$VERSION"
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for Gradlew
        run: chmod +x hub/dispatcher/gradlew
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests, build and push dispatcher Docker image
        working-directory: hub/dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.version }}
          MODEL_VERSIONS: ${{ vars.MODEL_VERSIONS }}
        run: |
          # Build for each model version
          for MODEL_VERSION in $MODEL_VERSIONS; do
            IMAGE_TAG="${TAG}-model-${MODEL_VERSION}"
            echo "Building image for $IMAGE_TAG"
            ./gradlew jib \
              -Pversion=$TAG \
              -PmodelVersion=$MODEL_VERSION \
              --image ghcr.io/${{ github.repository_owner }}/dispatcher:$IMAGE_TAG
          done
