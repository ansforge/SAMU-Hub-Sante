def INTEGRATION_TAG = 'integration'
def PERFORMANCE_TAG = 'performance'

tasks.named('test') {
    description = 'Runs the unit tests'
    useJUnitPlatform {
        excludeTags INTEGRATION_TAG, PERFORMANCE_TAG
    }
    testLogging {
        events 'failed', 'skipped'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the Testcontainers-backed tests. Requires a Docker daemon.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags INTEGRATION_TAG
        excludeTags PERFORMANCE_TAG
    }
    testLogging {
        events 'failed', 'skipped'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('performanceTest', Test) {
    description = 'Runs the performance tests. Requires a Docker daemon.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags PERFORMANCE_TAG
    }
    shouldRunAfter tasks.named('integrationTest')
}

jacocoTestReport {
    executionData tasks.withType(Test)
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.withType(Test).configureEach {
    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData tasks.withType(Test)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.91
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.82
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
