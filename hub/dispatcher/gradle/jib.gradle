def appVersion = project.version.toString()

jib {
    from {
        image 'dhi.io/eclipse-temurin:21-alpine3.23'
    }
    container {
        environment = [
                'APP_VERSION'      : appVersion,
                'APP_MODEL_VERSION': modelVersion
        ]
    }
}

tasks.matching { it.name.startsWith('jib') }.configureEach {
    doFirst {
        // Project.DEFAULT_VERSION is set to "unspecified" by Gradle.
        // Same values when not provided by the user through a CLI argument.
        if (appVersion == Project.DEFAULT_VERSION) {
            throw new GradleException("-Pversion is required to build the dispatcher image (e.g. -Pversion=1.15.0 or -Pversion=local-dev)")
        }
    }
}
