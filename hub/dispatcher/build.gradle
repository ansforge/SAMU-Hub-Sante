plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'com.google.cloud.tools.jib' version '3.4.0'
    id 'jacoco'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'com.diffplug.spotless' version '8.1.0'
}

group = 'com.hubsante'

def modelVersion = project.hasProperty('modelVersion') ? project.getProperty('modelVersion') : '3.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    mainClass = 'com.hubsante.hub.HubApplication'
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    java {
        googleJavaFormat('1.29.0').aosp().formatJavadoc(false)
        target 'src/**/*.java'
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

repositories {
    /*
    * We use mavenCentral() for every dependency but the models library, which is published on GitHub Packages.
    * So we add a additional maven repository to fetch it
    *
    * During development, it can be convenient to be able to test changes in the models lib without having to publish it
    * In this case, we should execute the gradle task publishToMavenLocal() in the models project and then uncomment
    * the mavenLocal() line below. It will push the models lib to the local .m2 folder, and the gradle build on this project
    * will fetch it from there
     */
//    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/ansforge/SAMU-Hub-Modeles")
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
    }
}

ext {
    set('testcontainersVersion', "1.21.4")
    set('jsonSchemaValidatorVersion', "1.0.87")
    set('logstashEncoderVersion', "9.0")
    set('groovyJson', "3.0.9")
    set('orgJson', "20220924")
    set('univocityParsers', "2.9.1")
}

dependencies {
    // ===== Modèle =====
    implementation "com.hubsante:models:${modelVersion}"

    // ===== Spring Boot =====
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ===== Observabilité =====
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // ===== JSON / XML / CSV =====
    implementation "com.networknt:json-schema-validator:${jsonSchemaValidatorVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"
    implementation "com.univocity:univocity-parsers:${univocityParsers}"
    implementation "org.codehaus.groovy:groovy-json:${groovyJson}"
    implementation "org.json:json:${orgJson}"

    // ===== Lombok =====
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ===== Tests =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'

    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:rabbitmq'

}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // report is always generated after tests run
}

license {
    header = file('LICENSE_HEADER.txt')
    strictCheck = true

    ext {
        company = "Agence du Numerique en Sante (ANS)"
        year = licenseYear()
    }

    mapping 'java', 'JAVADOC_STYLE'
    include "**/*.java"
    exclude "**/test/**"
}

jib {
    from {
        image 'eclipse-temurin:21-jre'
    }
    to {
        image "ghcr.io/${System.getenv('GITHUB_REPOSITORY_OWNER')}/dispatcher"
        tags = gitRefs()
    }
    container {
        environment = [
            'APP_VERSION'  : project.version,
            'APP_MODEL_VERSION'  : modelVersion
        ]
    }
}

import groovy.json.JsonSlurper

def gitRefs() {
    try {
        def releaseCommitHash = null
        def tagName = null

        if (System.getenv('GITHUB_TOKEN')) {
            def releaseData = callGithubAPI('releases/latest')
            tagName = releaseData.tag_name

            def commitData = callGithubAPI('commits/tags/' + tagName)
            releaseCommitHash = commitData.sha.take(7)
            println("Release commit hash: " + releaseCommitHash)
        }

        new ByteArrayOutputStream().withStream { os ->
            exec {
                commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
                standardOutput = os
            }
            def currentCommitHash = os.toString().trim()
            println("Current commit hash: " + currentCommitHash)

            if (currentCommitHash == releaseCommitHash) {
                return ['latest', currentCommitHash, tagName]
            } else {
                return [currentCommitHash]
            }
        }
    } catch (Exception e) {
        throw new GradleException('Failed to retrieve Git commit hash.', e)
    }
}

static def licenseYear() {
    def currentYear = new Date().format('yyyy')
    def licenseYear

    if (currentYear != "2023") {
        licenseYear = "2023-" + currentYear
    } else {
        licenseYear = "2023"

    }
    return licenseYear
}

static def callGithubAPI(String endpoint) {
    // GitHub API base URL
    def apiUrl = 'https://api.github.com/repos/ansforge/SAMU-Hub-Sante/'
    def token = System.getenv('GITHUB_TOKEN')
    def request = new URL(apiUrl + endpoint).openConnection()
    request.setRequestProperty('Authorization', 'token ' + token)
    request.connect()

    return new JsonSlurper().parseText(request.getInputStream().getText())
}