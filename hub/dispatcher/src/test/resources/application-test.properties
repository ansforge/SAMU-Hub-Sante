# Shared configuration for the tests that need a Spring context, activated by @ActiveProfiles("test").
# Only overrides application.properties; values that vary per test class (broker endpoint, vhost)
# stay in that class's ApplicationContextInitializer.

client.configuration.file=classpath:config/clients.yaml
supported.messages.file=classpath:config/supported.messages.csv

spring.rabbitmq.ssl.key-store=classpath:config/certs/dispatcher/dispatcher.test.p12
spring.rabbitmq.ssl.key-store-password=dispatcher
spring.rabbitmq.ssl.trust-store=classpath:config/certs/trustStore
spring.rabbitmq.ssl.trust-store-password=trustStore

# short enough for the expiration tests to wait it out
dispatcher.default.ttl=5

management.tracing.sampling.probability=0
