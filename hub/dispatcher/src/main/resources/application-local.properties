spring.rabbitmq.host=localhost
spring.rabbitmq.virtual-host=15-nexsis_v1.9

spring.rabbitmq.ssl.key-store-password=certPassword
spring.rabbitmq.ssl.trust-store-password=trustStore

conversion.service.url=http://localhost:8080

# Forces Spring to start a tomcat server
# although no endpoint has been defined
# (necessary to enable actuator endpoints locally)
spring.main.web-application-type=reactive

logging.level.com.hubsante.hub=DEBUG
