spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5671
spring.rabbitmq.ssl.enabled=true

spring.rabbitmq.ssl.key-store-password=${DISPATCHER_KEYSTORE_PASSWORD}
spring.rabbitmq.ssl.trust-store-password=${DISPATCHER_TRUSTSTORE_PASSWORD}

spring.rabbitmq.ssl.key-store=file:/certs/dispatcher.p12
spring.rabbitmq.ssl.trust-store=file:/certs/trustStore

# enable publisher returns and confirms feature
# the two callbacks are activated by the two following properties : template.mandatory & publisher-confirm-type
# template.mandatory => triggers return callback if the message cannot be carried to the final destination 
# (eg publishing on exchange OK, but broken binding to queue)
# publisher-confirm-type => determines the confirm behaviour :
# None (default) : no confirm callback
# correlated : a callback is triggered for every sent message, with a ack / nack / reject bound to it
# this implies the channel used to publish to be kept waiting for the calback, and can lead to concurrency use of
# several channels by the Rabbit CachingConnectionFactory, putting the strict ordening of message deliveries in jeopardy
# alternative would be to chain RabbitTemplate calls in a strict invoke() method.
# As of today, we prefer to deactivate the callback at all
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.version=${APP_VERSION:unknown}
app.model-version=${APP_MODEL_VERSION:unknown}

supported.messages.file=file:/config/supported.messages.csv
client.configuration.file=file:/config/clients.yaml
# dispatcher.default.ttl needs to be syncd with RabbitMQ conf :
# expressed in seconds for readability and use in code,
# should match the message TTL applied to all client queues (which is in milliseconds)
dispatcher.default.ttl=86400
#dispatcher.vhost=${DISPATCHER_VHOST} # this is mandatory but needs to be set in the personal profile properties file

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.health.ping.enabled=false
management.health.diskspace.enabled=false

management.opentelemetry.resource-attributes.service.name=dispatcher-${spring.rabbitmq.virtual-host}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

conversion.service.url=http://converter:8080
